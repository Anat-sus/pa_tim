<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/85 shadow-sm shadow-slate-200/40 backdrop-blur-xl">
  <div class="mx-auto grid min-h-[72px] w-[calc(100%-2rem)] max-w-6xl grid-cols-[1fr_auto_1fr] items-center">
    <a
      class="group flex shrink-0 items-center gap-2.5 justify-self-start text-slate-800 no-underline"
      routerLink="/customer-management"
      aria-label="PA TIM หน้าหลัก"
    >
      <span class="grid size-10 place-items-center rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-xl shadow-lg shadow-blue-600/20 transition-transform duration-200 group-hover:-rotate-3 group-hover:scale-105">🍱</span>
      <span class="flex flex-col leading-none">
        <strong class="text-[15px] font-extrabold tracking-[0.22em] text-slate-800">PA TIM</strong>
        <small class="mt-1 text-[9px] font-medium tracking-wide text-slate-400">DELIVERY MANAGER</small>
      </span>
    </a>

    <nav class="col-start-2 flex items-center justify-center gap-1 rounded-2xl border border-slate-200/80 bg-slate-100/70 p-1.5 shadow-inner shadow-slate-200/30" aria-label="เมนูหลัก">
      @for (item of navigationItems; track item.route) {
        <a
          class="group relative inline-flex min-w-28 items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-500 no-underline transition-all duration-200 hover:bg-white hover:text-blue-600 hover:shadow-sm"
          [routerLink]="item.route"
          routerLinkActive="!bg-white !text-blue-700 !shadow-sm"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
</header>
